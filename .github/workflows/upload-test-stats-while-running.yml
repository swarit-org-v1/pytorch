name: Upload test stats while running

on:
  schedule:
    # Every hour
    - cron: '0 * * * *'

concurrency:
  group: upload-test-stats-while-running
  cancel-in-progress: true

jobs:
  upload_test_stats_while_running:
    if: github.repository_owner == 'pytorch'
    name: Upload test stats while running
    runs-on: linux.2xlarge
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Checkout PyTorch
        uses: pytorch/pytorch/.github/actions/checkout-pytorch@6ea779188c21b385e03545acc7b8074e55f33bea # main
        with:
          fetch-depth: 1
          submodules: false

      - name: Setup Linux
        uses: ./.github/actions/setup-linux

      - name: Install requirements
        run: |
          python3 -m pip install requests==2.32.2 boto3==1.35.42

      - name: Upload test stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -m tools.stats.upload_test_stats_running_jobs
