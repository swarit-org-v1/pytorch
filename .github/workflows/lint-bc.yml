name: BC Lint

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches-ignore:
      - nightly
  push:
    tags:
      # TODO: Remove me later
      -  ciflow/inductor-cu126/*
  workflow_dispatch:

jobs:
  bc_linter:
    if: github.repository_owner == 'pytorch'
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
        with:
          egress-policy: audit

      - name: Run BC Lint Action
        uses: pytorch/test-infra/.github/actions/bc-lint@0cecaa5959b2efd2855f987b8ad83c3620f2d8dd # main
        with:
          repo: ${{ github.event.pull_request.head.repo.full_name }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          suppression: ${{ contains(github.event.pull_request.labels.*.name, 'suppress-api-compatibility-check') || contains(github.event.pull_request.labels.*.name, 'suppress-bc-linter') }}
          docs_link: 'https://github.com/pytorch/test-infra/wiki/BC-Linter'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true
