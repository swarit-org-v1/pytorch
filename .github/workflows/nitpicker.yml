name: Nitpicker

on:
  pull_request_target:
    types: [opened, reopened]
    branches: [main]

  pull_request:
    types: [opened, reopened]
    branches: [gh/**/base]

jobs:
  triage:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    # Do not comment on nightly builds PR
    if: ${{ github.event.pull_request.number != 26921 && github.repository_owner == 'pytorch' }}
    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2 # v2.13.2
      with:
        egress-policy: audit

    - name: Checkout PyTorch
      uses: pytorch/pytorch/.github/actions/checkout-pytorch@b5e0e6932aabb5115ac31c52a2db1821f39dc322 # main
    - uses: ethanis/nitpicker@c102a39683a80c7db9065f8eab7de8b58871f946 # v1.6
      with:
        nitpicks: '.github/nitpicks.yml'
        token: "${{ secrets.GITHUB_TOKEN }}"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}-${{ github.event_name == 'workflow_dispatch' }}
  cancel-in-progress: true
